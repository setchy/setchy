name: Update README

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:

jobs:
  markscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=setchy&show_icons=true&count_private=true&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: user=setchy&stroke=ffffff&background=1c1917&ring=0891b2&fire=0891b2&currStreakNum=ffffff&currStreakLabel=0891b2&sideNums=ffffff&sideLabels=ffffff&dates=ffffff&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Save skills card
        if: github.event_name != 'schedule'
        env:
          SKILLS: |
            javascript
            typescript
            java
            html
            css3
            reactjs
            vuejs
            astro
            tailwindcss
            electron
            expo
            tanstack
            zustand
            axios
            auth0
            nodejs
            expressjs
            spring
            springboot
            graphql
            apollo
            netflixdgs
            openapi
            swagger
            postman
            npm
            pnpm
            apachemaven
            vite
            vitest
            biome
            sonarqube
            renovate
            docker
            githubactions
            githubpages
            launchdarkly
            github
            githubcopilot
            bitbucket
            jira
            confluence
            slack
            drawio
            intellijidea
            visualstudiocode
        run: |
          skills=$(echo "$SKILLS" | xargs | tr ' ' ',')
          curl --fail --location --retry 3 --get \
            --data-urlencode "perline=10" \
            --data-urlencode "i=$skills" \
            --output profile/skills.svg \
            https://skills.syvixor.com/api/icons

      - uses: muesli/readme-scribe@5a187a2a36ef894335f17a7d01c32b0e28c6d948 # v0.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: README.md
          path: README.md

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "docs: Update generated README"
          branch: main
